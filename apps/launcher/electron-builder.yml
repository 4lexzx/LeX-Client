appId: com.lexclient.launcher
productName: LEX CLIENT
electronVersion: 38.8.6
directories:
  output: dist-app
  buildResources: ./assets
files:
  - "dist/renderer/**/*"
  - "electron/**/*"
  - "modules/catalog.mjs"
  - "modules/cosmetics.mjs"
  - "assets/**/*"
  - "package.json"
  - "!**/node_modules/**"
  - "!**/*.map"
  - "!CHANGELOG.md"
asar: false
afterPack: ../../scripts/after-pack.mjs
compression: maximum
win:
  icon: assets/icon.png
  signAndEditExecutable: false
  target:
    - nsis
    - dir
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: LEX CLIENT
publish:
  provider: github
  owner: lex-client
  repo: lexclient
